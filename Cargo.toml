[workspace]
resolver = "2"
members = ["core", "net", "src-tauri"]

[workspace.package]
version = "2.2.0-beta.1"
edition = "2021"
# The highest MSRV any dependency declares, not a preference. zip 8 asks for
# 1.88, and several of the Tauri tree's crates (darling, plist, time,
# serde_with) already did before it. Nothing in CI checks this — the runners
# use stable — so it is a claim to keep honest by hand when a bump lands.
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["LoneBrownie"]
repository = "https://github.com/LoneBrownie/AddonManager"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
