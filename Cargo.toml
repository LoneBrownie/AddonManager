[workspace]
resolver = "2"
members = ["core", "net", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
authors = ["LoneBrownie"]
repository = "https://github.com/LoneBrownie/AddonManager"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
