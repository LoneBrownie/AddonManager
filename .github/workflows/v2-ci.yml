name: V2 CI

# The V2 rewrite lives on `dev` and is never merged to `main` (D3).
# Windows and Linux both run from the first commit, because a cross-platform
# project whose CI only runs one OS quietly stops being cross-platform.

on:
  push:
    branches: [dev]
    paths: ['v2/**', '.github/workflows/v2-ci.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2-ci.yml']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: v2

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Scoped to the headless crates on purpose. bam-app is in the same
      # workspace, so an unscoped `cargo clippy` would drag the Tauri shell in
      # and fail here for want of WebKitGTK on Linux and an .ico on Windows.
      # The app is built by its own job, which installs those.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p bam-core -p bam-net --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p bam-core -p bam-net --all-features

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-app-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-app-

      # Tauri needs WebKitGTK on Linux. Windows uses the bundled WebView2.
      - name: Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Build the Tauri shell
        run: cargo build -p bam-app

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Drift is the top risk for an AI-written codebase with no human
      # reviewing the diffs (V2-PLAN.md 10). Enforced, not hoped for.
      - name: Module size
        run: python scripts/check_module_size.py

      - name: Licence headers present
        run: |
          test -f ../LICENSE || { echo "LICENSE missing"; exit 1; }
          grep -q "GNU GENERAL PUBLIC LICENSE" ../LICENSE || {
            echo "LICENSE is not the GPL text"; exit 1; }
