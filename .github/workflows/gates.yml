name: Gates

# The rules that have to hold for any commit that ships, in one definition,
# called by both pipelines.
#
# They used to live only in CI, and the release workflow enforced none of them.
# That is not a theoretical gap: CI sat red for five commits — unformatted code
# and two modules past the size limit — while the release pipeline happily built
# and published two betas from exactly that code. A guardrail the shipping path
# ignores is a guardrail in name only, so Release now waits on this before it
# builds anything (V2-PLAN.md 5.1.2, 10).
#
# Everything here is cheap and answerable in about a minute, which is the other
# half of the point: a release that is going to be rejected should be rejected
# before it spends eight minutes compiling.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, when there is one, so the version can be checked against it.'
        required: false
        type: string

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Pinned rather than relying on whatever the runner image ships.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ hashFiles('Cargo.lock') }}
          restore-keys: gates-

      - name: Format
        run: cargo fmt --all --check

      # Scoped to the headless crates, as in CI: an unscoped clippy drags the
      # Tauri shell in and fails here for want of WebKitGTK.
      - name: Clippy
        run: cargo clippy -p bam-core -p bam-net --all-targets --all-features -- -D warnings

      # Drift is the top risk for an AI-written codebase with no human reviewing
      # the diffs (V2-PLAN.md 10). Enforced, not hoped for.
      - name: Module size
        run: python scripts/check_module_size.py

      # With a tag, this also checks that the tag and the declared version
      # agree. Without one it checks everything else, so a bad bundle config is
      # caught on the push that introduces it rather than on the tag that needs
      # it.
      - name: Bundle config
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            node scripts/check-bundle-config.mjs --tag "$TAG"
          else
            node scripts/check-bundle-config.mjs
          fi

      - name: Licence present
        run: |
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE || {
            echo "LICENSE is not the GPL text"; exit 1; }

      # Everything above asks whether the code we wrote is sound. This asks the
      # same of the code we did not write, which is most of it: an HTTP stack, a
      # TLS implementation, a zip reader — all of them parsing bytes fetched
      # from the internet on a user's machine. Nobody here is going to notice a
      # RustSec advisory by reading about it, so the pipeline reads for them,
      # and does it on the release path too rather than only on pushes.
      #
      # cargo-audit is fetched as a prebuilt binary and run directly, rather
      # than through rustsec/audit-check, because that action reports through
      # the checks API and so needs a token permission this workflow's callers
      # do not grant it — and a reusable workflow cannot ask for more than its
      # caller has. A plain `cargo audit` needs no token at all.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Vulnerabilities fail; "unmaintained" warnings do not. A Tauri dependency
      # tree always contains a few crates nobody has touched in two years, and
      # none of that is fixable from here — making it blocking would mean a red
      # gate that has to be waved past, which is how a gate stops being read.
      - name: Rust advisories
        run: cargo audit

      # Runtime dependencies only. The build and test tooling is large, noisy,
      # and never reaches a user's machine; an advisory in it is a thing to fix
      # in its own time rather than a reason to block a release. `--audit-level`
      # keeps this to the ones worth stopping for.
      - name: Frontend advisories
        run: npm audit --omit=dev --audit-level=high
