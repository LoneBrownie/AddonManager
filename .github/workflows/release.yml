name: Release

# Triggered by a tag, not by a package.json diff. V1 released on a version
# change in a pushed file, which fired on unrelated commits and made
# re-releasing awkward (V2-PLAN.md 9.2).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0-beta.1)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            # NSIS installer plus a portable zip, so users who cannot run an
            # installer still have something.
            args: --bundles nsis
          - os: ubuntu-22.04
            label: Linux
            # AppImage is the only Linux artifact that can self-update; deb is a
            # convenience download (V2-PLAN.md 9.1).
            #
            # rpm is dropped for the beta. RPM forbids a hyphen in its Version
            # field, and Tauri's bundler writes the config version there
            # verbatim — so a 2.0.0-beta.1 build produces an .rpm whose NEVRA
            # cannot be parsed. Verified by reading the header out of a real
            # bundle. Restore it when the version loses its prerelease suffix.
            args: --bundles appimage,deb

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The tag names the release; the config files name the build. Nothing
      # reconciles them, so a tag of v2.0.0-beta.2 against a config still saying
      # beta.1 produces installers, a release title and a Copy-diagnostics
      # string that all disagree with the tag people downloaded. Cheaper to
      # catch here than to re-cut a beta.
      - name: Tag agrees with the declared version
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const declared = {
              "src-tauri/tauri.conf.json": JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              "package.json": JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              "Cargo.toml": (fs.readFileSync("Cargo.toml", "utf8").match(/^version = "(.+)"$/m) || [])[1],
            };
            const tag = process.env.TAG.replace(/^v/, "");
            const wrong = Object.entries(declared).filter(([, v]) => v !== tag);
            for (const [file, v] of wrong) console.error(`${file} declares ${v}, tag is ${tag}`);
            if (wrong.length) process.exit(1);
            console.log(`tag and all three version files agree on ${tag}`);
          '

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      # Built on 22.04 rather than latest: the glibc a binary is linked against
      # sets the oldest distro it will run on, so building on the newest runner
      # would silently drop support for anything older.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      # The engine's own tests gate the release. Shipping a build whose test
      # suite was never run defeats the point of having one.
      - name: Test the engine
        run: cargo test -p bam-core -p bam-net

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing key for the updater. Until these secrets exist the build
          # still succeeds; it just produces unsigned artifacts that the
          # in-app updater will decline to install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Brownie's Addon Manager __VERSION__"
          releaseBody: |
            ## Brownie's Addon Manager __VERSION__

            > **This is a beta.** V2 is a rewrite, and this build has had far
            > less real-world use than V1. Back up your `Interface/AddOns`
            > folder before pointing it at a game directory you care about, and
            > please report anything that misbehaves — **Settings → Copy
            > diagnostics** produces a redacted summary worth attaching.

            **It installs alongside V1 rather than over the top.** It is a
            separate application with its own settings, so V1 keeps working and
            nothing is migrated automatically. To carry your addons across:
            export your list from V1 (**My Addons → Export Addon List**), add
            your game folder here as a server, then **Import list**.

            ### Windows
            Download and run the `.exe` installer.

            ### Linux
            Take the **AppImage** unless you have a reason not to. A `.deb` is
            also published; your package manager owns updates for it. There is
            no `.rpm` during the beta — RPM refuses a version like
            `2.0.0-beta.1` — so on Fedora or openSUSE, take the AppImage.

            ### Updating
            There is no in-app update during the beta. Betas are published as
            pre-releases, which GitHub deliberately keeps out of
            `releases/latest`, so watch this repository and install new ones by
            hand. Self-updating switches on for 2.0.0 proper.
          # Published, not a draft. A draft is invisible to everyone but the
          # repository owner, so a beta nobody can download is not a beta.
          #
          # The two matrix jobs share one release, so whichever finishes first
          # publishes it and the other adds its artifacts a few minutes later.
          # A watcher can catch it with only one platform present. That is the
          # price of not drafting; drafting and flipping it published at the end
          # trades it for a silent failure mode, where a signing job that cannot
          # see the draft ships unsigned artifacts and says nothing.
          releaseDraft: false
          # Any tag with a hyphen — v2.0.0-beta.1, v2.0.0-rc.1 — is a
          # pre-release. That keeps `releases/latest` pointing at V1's last
          # stable installer, which is still what the README sends people to.
          #
          # `github.ref_name` is the *branch* on a workflow_dispatch run, so the
          # dispatch input has to be consulted first or a hand-triggered beta
          # would publish itself as stable.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}

  sign:
    name: Sign artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Carried over from V1, which signed its installers this way.
      - uses: sigstore/cosign-installer@v3

      - name: Sign release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts && cd artifacts

          # Fails the job rather than shrugging. The build jobs have finished by
          # now and the release is published, so nothing to download means
          # something went wrong upstream — and unsigned artifacts that nobody
          # was told about are worse than a red tick.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm'

          for file in *; do
            [ -f "$file" ] || continue
            echo "Signing $file"
            cosign sign-blob --yes "$file" \
              --output-signature "$file.sig" \
              --output-certificate "$file.crt"
          done

          shopt -s nullglob
          uploads=(*.sig *.crt)
          if [ ${#uploads[@]} -gt 0 ]; then
            gh release upload "$TAG" "${uploads[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
