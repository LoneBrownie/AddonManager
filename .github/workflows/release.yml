name: Release

# Triggered by a tag, not by a package.json diff. V1 released on a version
# change in a pushed file, which fired on unrelated commits and made
# re-releasing awkward (V2-PLAN.md 9.2).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0-beta.1)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  # The same rules CI enforces, enforced here too. Without this the release
  # pipeline would happily ship code CI had already rejected — which is exactly
  # what it did for two betas.
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  build:
    name: ${{ matrix.label }}
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            # NSIS installer plus a portable zip, so users who cannot run an
            # installer still have something.
            args: --bundles nsis
          - os: ubuntu-22.04
            label: Linux
            # AppImage is the only Linux artifact that can self-update; deb is a
            # convenience download (V2-PLAN.md 9.1).
            #
            # rpm is dropped for the beta. RPM forbids a hyphen in its Version
            # field, and Tauri's bundler writes the config version there
            # verbatim — so a 2.0.0-beta.1 build produces an .rpm whose NEVRA
            # cannot be parsed. Verified by reading the header out of a real
            # bundle. Restore it when the version loses its prerelease suffix.
            args: --bundles appimage,deb

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The bundle config — tag against declared version, the apostrophe that
      # breaks NSIS, an rpm target that cannot express a prerelease version — is
      # checked by the gates job above, before any of this runs.

      # The notes come from CHANGELOG.md, and a version with no section there
      # fails here — in seconds, rather than publishing a release whose notes
      # silently describe the previous one.
      - name: Release notes from the changelog
        id: notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "body<<CHANGELOG_EOF"
            node scripts/changelog.mjs --version "${TAG#v}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # `createUpdaterArtifacts` is on, and with it Tauri builds every installer
      # and *then* refuses to finish without a private key — eight minutes in,
      # under the message "a public key has been found, but no private key".
      # Checking the secret here turns that into a ten-second failure that says
      # what to do about it.
      - name: Updater signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Generate a key with" \
                 "'npm run tauri -- signer generate' and add the private half as a" \
                 "repository secret, or set bundle.createUpdaterArtifacts to false."
            exit 1
          fi
          echo "signing key present"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      # Built on 22.04 rather than latest: the glibc a binary is linked against
      # sets the oldest distro it will run on, so building on the newest runner
      # would silently drop support for anything older.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      # The engine's own tests gate the release. Shipping a build whose test
      # suite was never run defeats the point of having one.
      - name: Test the engine
        run: cargo test -p bam-core -p bam-net

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing key for the updater. Until these secrets exist the build
          # still succeeds; it just produces unsigned artifacts that the
          # in-app updater will decline to install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Brownie’s Addon Manager __VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          # Published, not a draft. A draft is invisible to everyone but the
          # repository owner, so a beta nobody can download is not a beta.
          #
          # The two matrix jobs share one release, so whichever finishes first
          # publishes it and the other adds its artifacts a few minutes later.
          # A watcher can catch it with only one platform present. That is the
          # price of not drafting; drafting and flipping it published at the end
          # trades it for a silent failure mode, where a signing job that cannot
          # see the draft ships unsigned artifacts and says nothing.
          releaseDraft: false
          # Any tag with a hyphen — v2.0.0-beta.1, v2.0.0-rc.1 — is a
          # pre-release. That keeps `releases/latest` pointing at V1's last
          # stable installer, which is still what the README sends people to.
          #
          # `github.ref_name` is the *branch* on a workflow_dispatch run, so the
          # dispatch input has to be consulted first or a hand-triggered beta
          # would publish itself as stable.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}

  sign:
    name: Sign artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Carried over from V1, which signed its installers this way.
      - uses: sigstore/cosign-installer@v3

      - name: Sign release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts && cd artifacts

          # Fails the job rather than shrugging. The build jobs have finished by
          # now and the release is published, so nothing to download means
          # something went wrong upstream — and unsigned artifacts that nobody
          # was told about are worse than a red tick.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm'

          # `.cosign.sig`, not `.sig`. Tauri names its own minisign updater
          # signature `<installer>.sig` — exactly what cosign would write here —
          # so the previous naming uploaded cosign's signature over Tauri's with
          # --clobber and silently destroyed it. The release still looked
          # complete; only the updater would have failed, on a user's machine.
          for file in *; do
            [ -f "$file" ] || continue
            echo "Signing $file"
            cosign sign-blob --yes "$file" \
              --output-signature "$file.cosign.sig" \
              --output-certificate "$file.cosign.crt"
          done

          shopt -s nullglob
          uploads=(*.cosign.sig *.cosign.crt)
          if [ ${#uploads[@]} -gt 0 ]; then
            gh release upload "$TAG" "${uploads[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      # The updater reads one fixed URL, so the manifest has to live at one.
      #
      # The obvious choice, `releases/latest/download/latest.json`, cannot work
      # here: GitHub defines "latest" as the newest release that is *not* a
      # pre-release, so it would never resolve to a beta — and making betas
      # non-pre-releases would hand `releases/latest` to V2 and break the link
      # V1 users follow. A fixed `updater` tag sidesteps both: direct
      # `releases/download/<tag>/` URLs serve pre-release assets happily, and
      # this release never becomes anyone's "latest".
      #
      # The manifest is composed here rather than taken from tauri-action, which
      # declines to build one — "Signature not found for the updater JSON" —
      # because the matrix splits the platforms across two jobs and neither sees
      # a complete set. The inputs are simple and already on the release, so
      # assembling it here is both shorter and predictable.
      #
      # Asset *names* are read back from the release rather than reused from the
      # build, because GitHub rewrites them on upload: apostrophes and spaces
      # become dots, so the local filename is not the download filename.
      - name: Publish the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p manifest && cd manifest

          # Tauri's minisign signatures, which survive now that cosign writes
          # `.cosign.sig` instead of clobbering these.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-setup.exe.sig' --pattern '*.AppImage.sig'

          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets[].name')
          win_name=$(printf '%s\n' "$names" | grep -- '-setup\.exe$')
          lin_name=$(printf '%s\n' "$names" | grep -- '\.AppImage$')

          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n \
            --arg version "${TAG#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "See the release notes for $TAG." \
            --arg win_sig "$(cat -- *-setup.exe.sig)" \
            --arg win_url "$base/$win_name" \
            --arg lin_sig "$(cat -- *.AppImage.sig)" \
            --arg lin_url "$base/$lin_name" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "linux-x86_64":   {signature: $lin_sig, url: $lin_url}
              }}' > latest.json

          cat latest.json

          # Created once, reused forever. Marked as a pre-release so it stays
          # out of `releases/latest` like everything else here.
          gh release view updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create updater \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Updater manifest" \
              --notes "Not a download. This release exists so the in-app updater has a stable URL to read; the installers are on the versioned releases."

          gh release upload updater latest.json --repo "$GITHUB_REPOSITORY" --clobber
