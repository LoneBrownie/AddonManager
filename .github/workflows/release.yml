name: Release

# Triggered by a tag, not by a package.json diff. V1 released on a version
# change in a pushed file, which fired on unrelated commits and made
# re-releasing awkward (V2-PLAN.md 9.2).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0-beta.1)'
        required: true

permissions:
  contents: write
  id-token: write
  # Deploying the update manifests to Pages.
  pages: write

jobs:
  # The same rules CI enforces, enforced here too. Without this the release
  # pipeline would happily ship code CI had already rejected — which is exactly
  # what it did for two betas.
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  build:
    name: ${{ matrix.label }}
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            # NSIS installer plus a portable zip, so users who cannot run an
            # installer still have something.
            args: --bundles nsis
          - os: ubuntu-22.04
            label: Linux
            # AppImage only. deb and rpm were published as convenience
            # downloads, and the convenience was a lie: the updater picks its
            # download by searching the manifest for `linux-x86_64-<installer>`
            # and falling back to `linux-x86_64`, which names the AppImage — so
            # a .deb installation was offered an update, downloaded an AppImage
            # and handed it to `install_deb`. A button that cannot work is worse
            # than no package. rpm additionally could not express a hyphenated
            # version at all (V2-PLAN.md 9.1).
            args: --bundles appimage

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The bundle config — tag against declared version, the apostrophe that
      # breaks NSIS, an rpm target that cannot express a prerelease version — is
      # checked by the gates job above, before any of this runs.

      # The notes come from CHANGELOG.md, and a version with no section there
      # fails here — in seconds, rather than publishing a release whose notes
      # silently describe the previous one.
      - name: Release notes from the changelog
        id: notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "body<<CHANGELOG_EOF"
            node scripts/changelog.mjs --version "${TAG#v}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # `createUpdaterArtifacts` is on, and with it Tauri builds every installer
      # and *then* refuses to finish without a private key — eight minutes in,
      # under the message "a public key has been found, but no private key".
      # Checking the secret here turns that into a ten-second failure that says
      # what to do about it.
      - name: Updater signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Generate a key with" \
                 "'npm run tauri -- signer generate' and add the private half as a" \
                 "repository secret, or set bundle.createUpdaterArtifacts to false."
            exit 1
          fi
          echo "signing key present"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      # Built on 22.04 rather than latest: the glibc a binary is linked against
      # sets the oldest distro it will run on, so building on the newest runner
      # would silently drop support for anything older.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      # The engine's own tests gate the release. Shipping a build whose test
      # suite was never run defeats the point of having one.
      - name: Test the engine
        run: cargo test -p bam-core -p bam-net

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing key for the updater. Until these secrets exist the build
          # still succeeds; it just produces unsigned artifacts that the
          # in-app updater will decline to install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          # Just the version. The repository name is already above every
          # release on the page, so repeating the app name in each title only
          # pushes the one thing that differs off to the right.
          releaseName: "__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          # Published, not a draft. A draft is invisible to everyone but the
          # repository owner, so a beta nobody can download is not a beta.
          #
          # The two matrix jobs share one release, so whichever finishes first
          # publishes it and the other adds its artifacts a few minutes later.
          # A watcher can catch it with only one platform present. That is the
          # price of not drafting; drafting and flipping it published at the end
          # trades it for a silent failure mode, where a signing job that cannot
          # see the draft ships unsigned artifacts and says nothing.
          releaseDraft: false
          # Any tag with a hyphen — v2.0.0-beta.1, v2.0.0-rc.1 — is a
          # pre-release. That keeps `releases/latest` pointing at V1's last
          # stable installer, which is still what the README sends people to.
          #
          # `github.ref_name` is the *branch* on a workflow_dispatch run, so the
          # dispatch input has to be consulted first or a hand-triggered beta
          # would publish itself as stable.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}

  sign:
    name: Sign artifacts
    needs: build
    runs-on: ubuntu-latest
    # This job also deploys the update manifests, and `deploy-pages` refuses to
    # run outside the environment Pages owns.
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7

      # Carried over from V1, which signed its installers this way.
      - uses: sigstore/cosign-installer@v3

      - name: Sign release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts && cd artifacts

          # Fails the job rather than shrugging. The build jobs have finished by
          # now and the release is published, so nothing to download means
          # something went wrong upstream — and unsigned artifacts that nobody
          # was told about are worse than a red tick.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.exe' --pattern '*.AppImage'

          # `.cosign.sig`, not `.sig`. Tauri names its own minisign updater
          # signature `<installer>.sig` — exactly what cosign would write here —
          # so the previous naming uploaded cosign's signature over Tauri's with
          # --clobber and silently destroyed it. The release still looked
          # complete; only the updater would have failed, on a user's machine.
          for file in *; do
            [ -f "$file" ] || continue
            echo "Signing $file"
            cosign sign-blob --yes "$file" \
              --output-signature "$file.cosign.sig" \
              --output-certificate "$file.cosign.crt"
          done

          shopt -s nullglob
          uploads=(*.cosign.sig *.cosign.crt)
          if [ ${#uploads[@]} -gt 0 ]; then
            gh release upload "$TAG" "${uploads[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      # Two channels, two files. Which one a build reads is decided in Rust
      # from a stored preference, because the updater plugin's JavaScript API
      # cannot express the choice — see commands/update.rs.
      #
      # The updater reads one fixed URL, so each manifest has to live at one.
      #
      # `releases/latest/download/latest.json` cannot serve both: GitHub
      # defines "latest" as the newest release that is *not* a pre-release, so
      # it would never resolve to a beta. Holding each manifest in a release of
      # its own would work and would put two permanent entries on the releases
      # page that are not downloads. Pages costs neither: deployed from an
      # artifact, the files exist as a deployment rather than as a branch or a
      # release, and the site is two JSON documents.
      #
      # The manifest is tauri-action's own, downloaded rather than rebuilt.
      # v0 declined to produce one — "Signature not found for the updater JSON"
      # — because the matrix splits the platforms across two jobs and neither
      # saw a complete set, so this composed one by hand from the signatures and
      # the asset names. v1 merges the jobs' contributions and publishes a
      # `latest.json` that is strictly better than the hand-built one: it also
      # carries the per-installer keys, `linux-x86_64-appimage` and
      # `windows-x86_64-nsis`, which are the first thing the updater looks for.
      #
      # The notes are still ours. tauri-action writes the whole release body in
      # there, headings and download instructions included, where the updater
      # wants the changelog entry and nothing else.
      - name: Publish the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p manifest && cd manifest

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json

          # The real changelog entry, not a pointer to it. The updater shows
          # this before installing, and "see the release notes" is no use to
          # someone deciding whether to install — they are in the app, not on
          # the release page.
          notes=$(cd "$GITHUB_WORKSPACE" && node scripts/changelog.mjs \
                    --version "${TAG#v}" --section-only)

          jq --arg notes "$notes" '.notes = $notes' latest.json > with-notes.json
          mv with-notes.json latest.json

          # Fail loudly rather than deploy a manifest missing a platform. A
          # half-written one is worse than none: the channel it lands on stops
          # offering updates to whichever platform fell out, silently.
          for key in windows-x86_64 linux-x86_64; do
            jq -e --arg k "$key" '.platforms[$k].url and .platforms[$k].signature' \
              latest.json >/dev/null \
              || { echo "::error::latest.json has no $key entry"; exit 1; }
          done
          test "$(jq -r .version latest.json)" = "${TAG#v}" \
            || { echo "::error::latest.json version does not match $TAG"; exit 1; }

          cat latest.json

          # The site is exactly two files. Pages replaces the whole thing on
          # every deploy, so the manifest this tag does *not* change has to be
          # carried forward rather than left out.
          mkdir -p site

          # The beta channel takes every tag. It carries stable releases too,
          # or a tester on 2.1.0-beta.3 would never be overtaken by 2.1.0.
          cp latest.json site/beta.json

          case "$TAG" in
            *-*)
              # A pre-release must not disturb the stable channel. The current
              # stable manifest is taken from the newest stable release's own
              # asset rather than from the live site, which is behind a
              # ten-minute CDN cache and could hand back a stale answer.
              stable=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
              if [ -n "$stable" ]; then
                gh release download "$stable" --repo "$GITHUB_REPOSITORY" \
                  --pattern latest.json --dir site 2>/dev/null \
                  || echo "$stable predates per-release manifests"
              fi
              # Releases up to 2.0.1 have no manifest asset of their own, so if
              # a pre-release is the first tag to deploy Pages there would be
              # nothing to carry forward and the stable channel would 404. The
              # legacy release holds exactly that manifest, so it is the answer
              # until a stable release has published one.
              if [ ! -f site/latest.json ]; then
                gh release download updater --repo "$GITHUB_REPOSITORY" \
                  --pattern latest.json --dir site 2>/dev/null \
                  || echo "no stable manifest anywhere yet; the stable channel starts empty"
              fi
              ;;
            *)
              cp latest.json site/latest.json
              # On the release itself, not a phantom one. This is what the next
              # pre-release reads back to preserve the stable channel.
              gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
              ;;
          esac

          ls -l site

          # Legacy, and temporary. Every installation up to 2.0.1 has
          # `releases/download/updater/latest.json` compiled into it, so
          # dropping this would leave those users unable to update with nothing
          # to tell them so. Keep feeding it stable releases until they have all
          # moved onto a build that reads Pages, then delete that release and
          # this block.
          case "$TAG" in
            *-*) : ;;
            *)
              gh release view updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
                gh release upload updater latest.json --repo "$GITHUB_REPOSITORY" --clobber
              ;;
          esac

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: manifest/site
      - uses: actions/deploy-pages@v4
