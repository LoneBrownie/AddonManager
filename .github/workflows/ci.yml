name: CI

# Windows and Linux both run on every change, because a cross-platform project
# whose CI only runs one OS quietly stops being cross-platform.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Scoped to the headless crates on purpose. bam-app is in the same
      # workspace, so an unscoped `cargo clippy` would drag the Tauri shell in
      # and fail here for want of WebKitGTK on Linux and an .ico on Windows.
      # The app is built by its own job, which installs those.
      # Formatting is platform-independent, so it is checked once, in the gates
      # workflow below. Clippy and the tests run per OS because that is what
      # this matrix is for: a lint or a test that only fails on Windows is
      # exactly the kind this job exists to catch.
      - name: Clippy
        run: cargo clippy -p bam-core -p bam-net --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p bam-core -p bam-net --all-features

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-app-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-app-

      # Tauri needs WebKitGTK on Linux. Windows uses the bundled WebView2.
      - name: Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Build the Tauri shell
        run: cargo build -p bam-app

  # Formatting, lints, module size, bundle config, licence — defined once and
  # called by Release too, so the pipeline that ships cannot pass on code this
  # one rejects.
  gates:
    uses: ./.github/workflows/gates.yml
